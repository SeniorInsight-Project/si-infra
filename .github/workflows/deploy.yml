name: Deploy da stack

# Toda mudança na main que mexe na infraestrutura atualiza a stack do Swarm na VM da Azure.
# Roda no runner self-hosted da própria VM (labels azure-vm, swarm).

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "keycloak/**"
      - "postgres/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: [self-hosted, azure-vm]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Atualizar a stack
        run: bash deploy/scripts/deploy-stack.sh
