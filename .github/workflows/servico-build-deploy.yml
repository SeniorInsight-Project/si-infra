name: Build e deploy de serviço (reutilizável)

# Chamado pelo workflow deploy.yml de cada repositório de serviço quando a main recebe código:
#   1. builda a imagem Docker num runner do GitHub e publica no GHCR (tags main e sha-<commit>);
#   2. no runner self-hosted da VM da Azure, troca a imagem do serviço na stack do Swarm
#      e espera ele ficar saudável (o Swarm desfaz sozinho se falhar).

on:
  workflow_call:
    inputs:
      servico:
        description: Nome do serviço na stack (deploy/stack.yml do si-infra), ex. care-service
        required: true
        type: string
      build-args:
        description: build-args do docker build, uma por linha
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      imagem: ${{ steps.nome.outputs.imagem }}
    steps:
      - uses: actions/checkout@v4

      - id: nome
        run: |
          REPO="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "base=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"
          echo "imagem=ghcr.io/${REPO}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: ${{ inputs.build-args }}
          tags: |
            ${{ steps.nome.outputs.base }}:main
            ${{ steps.nome.outputs.imagem }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, azure-vm]
    timeout-minutes: 15
    concurrency:
      group: deploy-azure
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Atualizar o serviço na stack
        run: bash /opt/seniorinsight/infra/deploy/scripts/deploy-servico.sh "${{ inputs.servico }}" "${{ needs.build.outputs.imagem }}"
